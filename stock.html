<!DOCTYPE html>

<html>

<head>

<title>CRAXX Stock Management</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<h1>CRAXX STOCK MANAGEMENT</h1>

<div class="stock-top-buttons">

<button
class="save-stock-btn"
onclick="saveStock()"
>

💾 Save Stock

</button>

<button
class="back-btn"
onclick="
window.location.href=
'index.html'
"
>

🔙 Order Page

</button>

</div>

<div class="scan-stock-box">

<h2>Scan Stock Sheet</h2>

<p>
Upload or capture a stock sheet photo. Review detected items before replacing stock.
</p>

<input
type="file"
id="stockScanInput"
accept="image/*"
capture="environment"
>

<div class="scan-actions">

<button
class="save-stock-btn"
onclick="scanStockSheet()"
>
Scan Sheet
</button>

<button
class="back-btn"
onclick="applyScannedStock()"
>
Replace Stock
</button>

</div>

<div id="scanStatus" class="scan-status">
No scan yet
</div>

<textarea
id="scanText"
class="scan-text"
placeholder="OCR text will appear here. You can edit it before replacing stock."
></textarea>

<div id="scanPreview" class="scan-preview"></div>

</div>

<h2>

Stock History

</h2>

<div
id="stockHistory"
>

No history yet

</div>

<div
id="stockList"
>

</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="stock.js"></script>

</body>

</html>
